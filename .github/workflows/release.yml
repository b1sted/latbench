name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: b1sted/ci/.github/workflows/c-release.yml@v1
    with:
      pkg_name: latbench
      bin_path: build/bin/latbench
      version_flag: "-V"
      homepage: https://github.com/b1sted/latbench
      description: Empirical CPU, cache, TLB, DRAM, and OS latency microbenchmarking suite.
      license: GPL-3.0
      maintainer: Nikita Mandrykin <pkg@basted.dev>
      gpg_fingerprint: "0DDA70A6A02167984707F0F7A8DE7BE6803A4BE2"
      homebrew_tap: b1sted/homebrew-tap
      packages_dispatch_repo: b1sted/packages.basted.dev
      enable_cross_tests: true
      cross_test_args: selftest
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      PACKAGES_DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
